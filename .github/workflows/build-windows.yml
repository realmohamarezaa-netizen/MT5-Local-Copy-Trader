name: Build Windows (EXE + Setup ZIP)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Run unit tests (mocked - no MT5, no orders)
        run: python -m pytest tests -q -v

      - name: Build executable (PyInstaller)
        run: pyinstaller build/pyinstaller/TradingCopier.spec --distpath dist --workpath build/pyi --clean -y

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup -> TradingCopierSetup_x64.exe)
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\inno\TradingCopierSetup.iss'

      - name: Zip installer (classic-install friendly bundle)
        shell: pwsh
        run: |
          Compress-Archive -Path Output/TradingCopierSetup_x64.exe `
            -DestinationPath Output/TradingCopierSetup_x64.zip -Force
          Get-ChildItem Output

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TradingCopier-Windows-x64
          path: |
            Output/TradingCopierSetup_x64.exe
            Output/TradingCopierSetup_x64.zip
          if-no-files-found: error

      - name: Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/TradingCopierSetup_x64.exe
            Output/TradingCopierSetup_x64.zip
          generate_release_notes: true
